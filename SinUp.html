<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background-color: black;">
   
    <p class="N-ICON1">NETFLIX</p>
    <hr style="position: absolute;top: 70px;width: 1260px;border-color: #999798;" >
    <div
      style="
        background-color: rgba(10, 10, 10, 0.75);
        height: 30rem;
        width: 25rem;
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 10px;
        padding: 20px;
      "
    >
    <form>
      <img src="Frame 15.png" style="width: 15rem;height: 55px;position:absolute;left: 6rem;top: 3rem;">
      <input
        type="text"
        placeholder="Email or mobile number"
        style="
          background-color: transparent;
          border-radius: 5px;
          border-color: grey;
          cursor: pointer;
          padding: 22px;
          width: 300px;
          color: white;
          height: 10px;
          position: absolute;
          top: 9rem;
          right: 3rem;
        "
      />
      <input
        type="password"
        placeholder="Password"
        style="
          background-color: transparent;
          border-radius: 5px;
          border-color: grey;
          cursor: pointer;
          padding: 22px;
          width: 300px;
          color: white;
          height: 10px;
          position: absolute;
          top: 13rem;
          right: 3rem;
        "
      />
      <button type="submit"
        style="
          background-color: #e50914;
          border-radius: 4px;
          cursor: pointer;
          font-size: 15px;
          border: none;
          outline: none;
          padding: 10px;
          color: white;
          position: absolute;
          top: 18rem;
          left: 42px;
          width: 80%;
          font-weight: bold;
          text-align: center;
        "
      >
        Sign In
      </button>
      <label style="color: white; position: absolute; top: 21rem; right: 14rem"
        >OR</label
      >
      <button
        style="
          background-color: #3d3d3d;
          border-radius: 4px;
          cursor: pointer;
          font-size: 15px;
          border: none;
          outline: none;
          padding: 10px;
          color: white;
          position: absolute;
          top: 23rem;
          left: 42px;
          width: 80%;
          font-weight: bold;
          text-align: center;
        "
      >
        Use a Sign-In code
      </button>
      <u
        ><a
          href="https://www.netflix.com/in/loginHelp"
          style="
            color: white;
            position: absolute;
            top: 26rem;
            left: 10rem;
            width: 80%;
            font-weight: semibold;
          "
          >Forgot password?</a
        ></u
      >
      <input type="checkbox" style="position: absolute; top: 450px;left: 40px;" />
      <lebel style="color: white; position: absolute; top: 28rem; left: 58px"
        >Remember me</lebel
      >
      <div style="color: white; position: absolute; top: 30rem;left: 40px;">
        New to Netflix?<b>Sign up now.</b>
      </div>
    </div>
    </form>
    <div style="background-color: #3d3d3d;">
    <div
      style="
        position: absolute;
        top: 50rem;
        width: 1180px;
        height: 15rem;
        color: #b2b2b8;
        font-weight: semibold;
        background-color: #3d3d3d;
        padding-left: 5rem;
      "
    >
      <div style="position: absolute;top: 2rem ;">Questions? Call 000-800-919-1743 (Toll-Free)</div>
      <br />
      <div style="position: absolute; top: 5rem">
        <u>FAQ</u><br /><br />
        <u>Cookie</u> Preferences
      </div>
      <div style="position: absolute; left: 24rem; top: 5rem">
        <u>Help Centre</u><br /><br />
        <u>Corporate Information</u>
      </div>
      <div style="position: absolute; left: 40rem; top: 5rem">
        <u>Terms of Use</u>
      </div>
      <div style="position: absolute; left: 56rem; top: 5rem">
        <u>Privacy</u>
      </div>
    </div>
    </div>
   
  </body>
</html>
