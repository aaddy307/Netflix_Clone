<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dark-bg" ;" style="align-items: center;">
    <p class="N-ICON1">NETFLIX</p>
    <div
      style="
        background-color: rgba(10, 10, 10, 0.75);
        height: 30rem;
        width: 25rem;
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 10px;
        padding-left: 3rem;
        padding-top: 2rem;
      "
    >
    <form>
      <h1 style="color: white">Sign In</h1>
      <input
        type="text"
        placeholder="Email or mobile number"
        style="
          background-color: transparent;
          border-radius: 5px;
          border-color: grey;
          cursor: pointer;
          padding: 22px;
          width: 300px;
          color: white;
          height: 10px;
          position: absolute;
          top: 7rem;
          right: 3rem;
        "
      />
      <input
        type="password"
        placeholder="Password"
        style="
          background-color: transparent;
          border-radius: 5px;
          border-color: grey;
          cursor: pointer;
          padding: 22px;
          width: 300px;
          color: white;
          height: 10px;
          position: absolute;
          top: 11rem;
          right: 3rem;
        "
      />
      
      <button type="submit"
        style="
          background-color: #e50914;
          border-radius: 4px;
          cursor: pointer;
          font-size: 15px;
          border: none;
          outline: none;
          padding: 10px;
          color: white;
          position: absolute;
          top: 16rem;
          width: 80%;
          font-weight: bold;
          text-align: center;
        "
      >
        Sign In
      </button>
      <label style="color: white; position: absolute; top: 19rem; right: 14rem"
        >OR</label
      >
      <button
        style="
          background-color: #3d3d3d;
          border-radius: 4px;
          cursor: pointer;
          font-size: 15px;
          border: none;
          outline: none;
          padding: 10px;
          color: white;
          position: absolute;
          top: 21rem;
          width: 80%;
          font-weight: bold;
          text-align: center;
        "
      ><a href="SinUp.html" style="text-decoration: none;color: white;">
        Use a Sign-In code</a>
      </button>
      <u
        ><a
          href="https://www.netflix.com/in/loginHelp"
          style="
            color: white;
            position: absolute;
            top: 24rem;
            left: 10rem;
            width: 80%;
            font-weight: semibold;
          "
          >Forgot password?</a
        ></u
      >
      <input type="checkbox" style="position: absolute; top: 26rem" />
      <lebel style="color: white; position: absolute; top: 26rem; left: 5rem"
        >Remember me</lebel
      >
      <div style="color: white; position: absolute; top: 28rem">
        New to Netflix?<b>Sign up now.</b>
      </div>
    </div>
    
    <div
      style="
        /* border: 2px solid white; */
        position: absolute;
        top: 43rem;
        left: 9rem;
        width: 65rem;
        height: 10rem;
        color: #b2b2b8;
        font-weight: semibold;
      "
    >
      <div>Questions? Call 000-800-919-1743 (Toll-Free)</div>
      <br />
      <div style="position: absolute; top: 3rem">
        <u>FAQ</u><br /><br />
        <u>Cookie</u> Preferences
      </div>
      <div style="position: absolute; left: 16rem; top: 3rem">
        <u>Help Centre</u><br /><br />
        <u>Corporate Information</u>
      </div>
      <div style="position: absolute; left: 32rem; top: 3rem">
        <u>Terms of Use</u>
      </div>
      <div style="position: absolute; left: 48rem; top: 3rem">
        <u>Privacy</u>
      </div>
    </div>
    </form>
  </body>
</html>
